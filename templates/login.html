{% extends "base.html" %}

{% block title %}Login - Anime Arena{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-body p-5">
                <h2 class="card-title text-center mb-4">Login</h2>
                <div id="form-alert" class="alert d-none" role="alert"></div>
                <form id="login-form">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="Enter username">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" id="submit-btn" class="btn btn-primary">Login</button>
                    </div>
                </form>

                <div class="mt-3 text-center">
                    <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alert = document.getElementById('form-alert');
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    alert.className = 'alert d-none';
    try {
        const response = await fetch('/login', { method: 'POST', body: new FormData(this) });
        const data = await response.json();
        if (data.status === 'success') {
            alert.className = 'alert alert-success';
            alert.textContent = 'Login successful! Redirecting...';
            setTimeout(() => { window.location.href = data.redirect || '/'; }, 800);
        } else {
            alert.className = 'alert alert-danger';
            alert.textContent = data.message || 'Invalid username or password.';
            btn.disabled = false;
            btn.textContent = 'Login';
        }
    } catch {
        alert.className = 'alert alert-danger';
        alert.textContent = 'Network error. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Login';
    }
});
</script>
{% endblock %}
