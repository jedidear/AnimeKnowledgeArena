{% extends "base.html" %}

{% block title %}Register - Anime Arena{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-body p-5">
                <h2 class="card-title text-center mb-4">Create Account</h2>
                <div id="form-alert" class="alert d-none" role="alert"></div>
                <form id="register-form">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="Pick a username">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="Enter your email">
                        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Choose a password">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" id="submit-btn" class="btn btn-primary">Register</button>
                    </div>
                </form>

                <div class="mt-3 text-center">
                    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('register-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alert = document.getElementById('form-alert');
    btn.disabled = true;
    btn.textContent = 'Creating account...';
    alert.className = 'alert d-none';
    try {
        const response = await fetch('/register', { method: 'POST', body: new FormData(this) });
        const data = await response.json();
        if (data.status === 'success') {
            alert.className = 'alert alert-success';
            alert.textContent = data.message || 'Account created! Redirecting...';
            setTimeout(() => { window.location.href = data.redirect || '/login'; }, 1000);
        } else {
            alert.className = 'alert alert-danger';
            alert.textContent = data.message || 'Registration failed.';
            btn.disabled = false;
            btn.textContent = 'Register';
        }
    } catch (err) {
        alert.className = 'alert alert-danger';
        alert.textContent = 'An error occurred: ' + (err.message || 'Check console for details');
        console.error('Registration Error:', err);
        btn.disabled = false;
        btn.textContent = 'Register';
    }
});
</script>
{% endblock %}
